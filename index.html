<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>นาฬิกาเตือนลุกยืดเหยีด</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      transition: background 0.5s;
    }

    body.disco-mode {
      animation: discoBg 1.5s infinite alternate;
    }

    @keyframes discoBg {
      0% { background: linear-gradient(135deg, #1a1a2e, #880e4f); }
      50% { background: linear-gradient(135deg, #0d47a1, #1a1a2e); }
      100% { background: linear-gradient(135deg, #4a148c, #004d40); }
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #ff758c;
      margin-bottom: 10px;
    }

    .status-banner {
      background: rgba(255, 193, 7, 0.2);
      border: 1px solid #ffc107;
      color: #ffeb3b;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .status-banner.ready {
      background: rgba(76, 175, 80, 0.2);
      border-color: #4caf50;
      color: #81c784;
    }

    .clock-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .time-display {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    .countdown-display {
      font-size: 1.2rem;
      color: #ff8a00;
      margin-top: 5px;
    }

    .next-slot {
      font-size: 1rem;
      color: #a0a0a0;
      margin-top: 5px;
    }

    .playing-banner {
      display: none;
      background: linear-gradient(45deg, #ff007f, #7928ca);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.8; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
    }

    .btn-stop {
      background: linear-gradient(45deg, #f857a6, #ff5858);
      display: none;
    }

    .btn-secondary {
      background: linear-gradient(45deg, #11998e, #38ef7d);
      box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
    }

    .schedule-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      text-align: left;
      color: #e0e0e0;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }

    .slot-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .slot-item.passed {
      opacity: 0.4;
      text-decoration: line-through;
    }

    .slot-item.next {
      background: rgba(0, 242, 254, 0.2);
      border-color: #00f2fe;
      color: #00f2fe;
      font-weight: bold;
    }

    /* ซ่อน YouTube Player ไว้เบื้องหลัง */
    #youtube-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ตัวเล่น YouTube ลับ -->
  <div id="youtube-player"></div>

  <div class="container">
    <h1>🕺 เตือนลุกยืดเหยีด</h1>
    
    <div id="audioStatus" class="status-banner" onclick="initAudio()">
      ⚠️ คลิกที่นี่เพื่อเปิดใช้งานระบบเสียง
    </div>

    <div id="playingBanner" class="playing-banner">
      🎶 ลุก ได้ ลุก ลุก ค่ะ ลุก! 🕺<br>
      <span style="font-size: 0.9rem; font-weight: normal;">งานการเงิน... ได้เวลาเต้นขยับร่างกายแล้ว!</span>
    </div>

    <div class="clock-card">
      <div id="currentTime" class="time-display">00:00:00</div>
      <div id="countdown" class="countdown-display">กำลังโหลด...</div>
      <div id="nextTime" class="next-slot">รอบถัดไป: --:--</div>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="triggerDanceAlarm()">⚡ ทดสอบเพลง</button>
      <button id="stopBtn" class="btn btn-stop" onclick="stopDanceMusic()">🛑 หยุดเพลง</button>
      <button class="btn btn-secondary" onclick="requestNotification()">🔔 เปิดการแจ้งเตือน</button>
    </div>

    <div class="schedule-title">⏱️ ตารางเวลาเตือนวันนี้ (09:00 - 16:00 น.)</div>
    <div id="scheduleGrid" class="schedule-grid"></div>
  </div>

  <!-- โหลด YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const timeslots = [
      "09:00", "09:30", "10:00", "10:30",
      "11:00", "11:30", 
      "13:00", "13:30", "14:00", "14:30",
      "15:00", "15:30", "16:00"
    ];

    let player = null;
    let isYoutubeReady = false;
    let danceTimeout = null;

    // ID วิดีโอจาก YouTube Shorts: JJzgplzJUVg
    const youtubeVideoId = "JJzgplzJUVg"; 

    // โหลด YouTube Player
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        videoId: youtubeVideoId,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      isYoutubeReady = true;
    }

    function initAudio() {
      if (player && isYoutubeReady) {
        player.playVideo();
        player.pauseVideo(); // ปลดล็อกนโยบาย Autoplay ของเบราว์เซอร์
        
        const statusEl = document.getElementById('audioStatus');
        statusEl.classList.add('ready');
        statusEl.innerHTML = "🔊 ระบบเสียง YouTube Shorts พร้อมทำงานแล้ว";
      }
    }

    document.body.addEventListener('click', () => {
      initAudio();
    }, { once: true });

    function playDanceMusic() {
      if (!player || !isYoutubeReady) return;

      stopDanceMusic();

      document.getElementById('playingBanner').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'inline-block';
      document.body.classList.add('disco-mode');

      // เริ่มเล่นตั้งแต่ต้นคลิป Shorts (วินาทีที่ 0)
      player.seekTo(0, true); 
      player.playVideo();

      // คลิป Shorts มีความยาวประมาณ 30 วินาที ระบบจะหยุดเพลงให้อัตโนมัติเมื่อครบ 30 วินาที
      danceTimeout = setTimeout(() => {
        stopDanceMusic();
      }, 30000);
    }

    function stopDanceMusic() {
      if (danceTimeout) {
        clearTimeout(danceTimeout);
        danceTimeout = null;
      }

      if (player && player.pauseVideo) {
        player.pauseVideo();
      }

      document.getElementById('playingBanner').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'none';
      document.body.classList.remove('disco-mode');
    }

    // Web Worker ป้องกันเวลาหยุดเดินเมื่อสลับ Tab
    const workerCode = `
      setInterval(() => {
        postMessage('tick');
      }, 1000);
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = function() {
      updateClock();
    };

    let lastTriggeredMinute = "";

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const currentTimeStr = `${h}:${m}:${s}`;
      const timeHHMM = `${h}:${m}`;

      document.getElementById('currentTime').innerText = currentTimeStr;

      let nextTarget = null;
      for (let slot of timeslots) {
        if (slot > timeHHMM) {
          nextTarget = slot;
          break;
        }
      }

      if (timeslots.includes(timeHHMM) && s === "00" && lastTriggeredMinute !== timeHHMM) {
        lastTriggeredMinute = timeHHMM;
        triggerDanceAlarm();
      }

      if (nextTarget) {
        document.getElementById('nextTime').innerText = `รอบถัดไป: ${nextTarget} น.`;
        const [targetH, targetM] = nextTarget.split(':').map(Number);
        const targetDate = new Date();
        targetDate.setHours(targetH, targetM, 0, 0);
        
        const diffMs = targetDate - now;
        const diffMin = Math.floor(diffMs / 60000);
        const diffSec = Math.floor((diffMs % 60000) / 1000);
        
        document.getElementById('countdown').innerText = `เหลือเวลาอีก ${diffMin} นาที ${diffSec} วินาที`;
      } else {
        document.getElementById('nextTime').innerText = `หมดรอบเตือนสำหรับวันนี้แล้ว`;
        document.getElementById('countdown').innerText = `รักษาสุขภาพกันด้วยนะ!`;
      }

      renderSchedule(timeHHMM, nextTarget);
    }

    function renderSchedule(currentHHMM, nextTarget) {
      const grid = document.getElementById('scheduleGrid');
      grid.innerHTML = '';

      timeslots.forEach(slot => {
        const item = document.createElement('div');
        item.className = 'slot-item';

        if (slot < currentHHMM) {
          item.classList.add('passed');
        } else if (slot === nextTarget) {
          item.classList.add('next');
        }

        item.innerHTML = `⏰ ${slot}`;
        grid.appendChild(item);
      });
    }

    function triggerDanceAlarm() {
      playDanceMusic();

      if (Notification.permission === 'granted') {
        new Notification("🕺 ได้เวลาลุกยืดเหยีด", {
          body: "🎶 ลุก ได้ ลุก ลุก ค่ะ ลุก! 🕺! ลุกขึ้นยืดเหยียด 30 วินาทีกันจ้าาา",
          icon: "https://cdn-icons-png.flaticon.com/512/3076/3076921.png"
        });
      }
    }

    function requestNotification() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("เปิดการแจ้งเตือนเรียบร้อยแล้ว!");
          }
        });
      }
    }

    updateClock();
  </script>
</body>
</html>
