<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>นาฬิกาเตือนลุกเต้นยืดเส้นยืดสาย (09:00 - 16:00)</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #ff758c;
      margin-bottom: 10px;
    }

    .status-banner {
      background: rgba(255, 193, 7, 0.2);
      border: 1px solid #ffc107;
      color: #ffeb3b;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .status-banner.ready {
      background: rgba(76, 175, 80, 0.2);
      border-color: #4caf50;
      color: #81c784;
    }

    .clock-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .time-display {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    .countdown-display {
      font-size: 1.2rem;
      color: #ff8a00;
      margin-top: 5px;
    }

    .next-slot {
      font-size: 1rem;
      color: #a0a0a0;
      margin-top: 5px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
    }

    .btn-secondary {
      background: linear-gradient(45deg, #11998e, #38ef7d);
      box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
    }

    .schedule-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      text-align: left;
      color: #e0e0e0;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }

    .slot-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .slot-item.passed {
      opacity: 0.4;
      text-decoration: line-through;
    }

    .slot-item.next {
      background: rgba(0, 242, 254, 0.2);
      border-color: #00f2fe;
      color: #00f2fe;
      font-weight: bold;
    }

    /* Modal Overlay for Alarm */
    .alarm-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: flash 1s infinite alternate;
    }

    @keyframes flash {
      0% { background: rgba(255, 0, 85, 0.8); }
      100% { background: rgba(0, 100, 255, 0.8); }
    }

    .alarm-box {
      background: #111;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 90%;
      width: 400px;
      border: 2px solid #fff;
    }

    .alarm-box h2 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 15px;
    }

    .alarm-box p {
      font-size: 1.2rem;
      margin-bottom: 25px;
      color: #ffeb3b;
    }

    .dance-btn {
      background: #00e676;
      color: #000;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 15px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px #00e676;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💃 เตือนลุกเต้นยืดเส้นยืดสาย</h1>
    
    <div id="audioStatus" class="status-banner" onclick="initAudio()">
      ⚠️ คลิกที่นี่หนึ่งครั้ง เพื่อเปิดใช้งานระบบเสียงอัตโนมัติ
    </div>

    <div class="clock-card">
      <div id="currentTime" class="time-display">00:00:00</div>
      <div id="countdown" class="countdown-display">กำลังโหลด...</div>
      <div id="nextTime" class="next-slot">รอบถัดไป: --:--</div>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="triggerAlarm()">⚡ ทดสอบเตือนทันที</button>
      <button class="btn btn-secondary" onclick="requestNotification()">🔔 เปิดการแจ้งเตือน</button>
    </div>

    <div class="schedule-title">⏱️ ตารางเวลาเตือนวันนี้ (09:00 - 16:00 น.)</div>
    <div id="scheduleGrid" class="schedule-grid"></div>
  </div>

  <!-- หน้าต่างป๊อปอัพเตือนเมื่อถึงเวลา -->
  <div id="alarmModal" class="alarm-modal">
    <div class="alarm-box">
      <h2>⏰ ถึงเวลาลุกยืดเส้นยืดสาย!</h2>
      <p>พักสายตา แล้วออกสเต็ปสักนิด 🎵</p>
      <button class="dance-btn" onclick="stopAlarmAndPlayDance()">🕺 ปิดเตือน & เล่นเพลงเต้น!</button>
    </div>
  </div>

  <script>
    const timeslots = [
      "09:00", "09:30", "10:00", "10:30",
      "11:00", "11:30", ,
      "13:00", "13:30", "14:00", "14:30",
      "15:00", "15:30", "16:00"
    ];

    let audioCtx = null;
    let isAudioReady = false;
    let danceMusicLoop = null;
    let keepAliveOsc = null;
    let activeAlarmOsc = null;

    // Web Worker ป้องกันการนอนหลับเมื่อสลับ Tab
    const workerCode = `
      setInterval(() => {
        postMessage('tick');
      }, 1000);
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = function() {
      updateClock();
    };

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      // สร้างเสียงเงียบแบบวนลูปไว้ เพื่อรักษาความสดของ Background Audio Context
      if (!keepAliveOsc) {
        const silentOsc = audioCtx.createOscillator();
        const silentGain = audioCtx.createGain();
        silentGain.gain.value = 0.001; // เบามากจนไม่ได้ยิน
        silentOsc.connect(silentGain);
        silentGain.connect(audioCtx.destination);
        silentOsc.start();
        keepAliveOsc = silentOsc;
      }

      isAudioReady = true;
      const statusEl = document.getElementById('audioStatus');
      statusEl.classList.add('ready');
      statusEl.innerHTML = "🔊 ระบบเสียงพร้อมทำงานใน Background แล้ว";
    }

    document.body.addEventListener('click', () => {
      if (!isAudioReady) initAudio();
    }, { once: true });

    function playBellSound() {
      if (!audioCtx) initAudio();
      
      const now = audioCtx.currentTime;
      // เสียงกระดิ่งปิ๊งๆ
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now); // A5
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);

      gain.gain.setValueAtTime(1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.5);
    }

    function playDanceMusic() {
      if (!audioCtx) return;
      stopDanceMusic();

      const bpm = 128;
      const stepTime = 60 / bpm / 4;
      let step = 0;

      danceMusicLoop = setInterval(() => {
        const now = audioCtx.currentTime;
        
        // Kick Bass
        if (step % 4 === 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.15);
          gain.gain.setValueAtTime(1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        }

        // Synth Melody
        if (step % 2 === 0) {
          const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
          const note = notes[(step / 2) % notes.length];
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(note, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        }

        step = (step + 1) % 16;
      }, stepTime * 1000);
    }

    function stopDanceMusic() {
      if (danceMusicLoop) {
        clearInterval(danceMusicLoop);
        danceMusicLoop = null;
      }
    }

    let lastTriggeredMinute = "";

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const currentTimeStr = `${h}:${m}:${s}`;
      const timeHHMM = `${h}:${m}`;

      document.getElementById('currentTime').innerText = currentTimeStr;

      // ค้นหารอบถัดไป
      let nextTarget = null;
      for (let slot of timeslots) {
        if (slot > timeHHMM) {
          nextTarget = slot;
          break;
        }
      }

      // เช็คว่าถึงเวลาเตือนหรือยัง
      if (timeslots.includes(timeHHMM) && s === "00" && lastTriggeredMinute !== timeHHMM) {
        lastTriggeredMinute = timeHHMM;
        triggerAlarm();
      }

      // แสดงเวลาถัดไป & นับถอยหลัง
      if (nextTarget) {
        document.getElementById('nextTime').innerText = `รอบถัดไป: ${nextTarget} น.`;
        const [targetH, targetM] = nextTarget.split(':').map(Number);
        const targetDate = new Date();
        targetDate.setHours(targetH, targetM, 0, 0);
        
        const diffMs = targetDate - now;
        const diffMin = Math.floor(diffMs / 60000);
        const diffSec = Math.floor((diffMs % 60000) / 1000);
        
        document.getElementById('countdown').innerText = `เหลือเวลาอีก ${diffMin} นาที ${diffSec} วินาที`;
      } else {
        document.getElementById('nextTime').innerText = `หมดรอบเตือนสำหรับวันนี้แล้ว`;
        document.getElementById('countdown').innerText = `พักผ่อนได้แล้ว!`;
      }

      renderSchedule(timeHHMM, nextTarget);
    }

    function renderSchedule(currentHHMM, nextTarget) {
      const grid = document.getElementById('scheduleGrid');
      grid.innerHTML = '';

      timeslots.forEach(slot => {
        const item = document.createElement('div');
        item.className = 'slot-item';

        if (slot < currentHHMM) {
          item.classList.add('passed');
        } else if (slot === nextTarget) {
          item.classList.add('next');
        }

        item.innerHTML = `⏰ ${slot}`;
        grid.appendChild(item);
      });
    }

    function triggerAlarm() {
      initAudio();
      playBellSound();
      
      // แสดง Modal
      document.getElementById('alarmModal').style.display = 'flex';

      // Desktop Notification
      if (Notification.permission === 'granted') {
        new Notification("⏰ ได้เวลาลุกเต้นยืดเส้นยืดสาย!", {
          body: "กดที่นี่เพื่อเปิดเพลงเต้นและยืดเส้นยืดสาย 30 วินาที",
          icon: "https://cdn-icons-png.flaticon.com/512/3076/3076921.png"
        });
      }
    }

    function stopAlarmAndPlayDance() {
      document.getElementById('alarmModal').style.display = 'none';
      playDanceMusic();

      // เล่นเพลง 20 วินาทีแล้วหยุดให้อัตโนมัติ
      setTimeout(() => {
        stopDanceMusic();
      }, 20000);
    }

    function requestNotification() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("เปิดการแจ้งเตือนเรียบร้อยแล้ว!");
          }
        });
      }
    }

    updateClock();
  </script>
</body>
</html>
